name: Check
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
env:
  NIX_CONFIG: |
    accept-flake-config = true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Deterministic checks
        run: nix develop -c just check
      - name: Packaged service acceptance
        run: nix develop -c just acceptance
      - name: Nix packages and flake checks
        run: |
          nix build .#kansoku-server .#kansoku-client
          nix flake check
      - name: Sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-evidence
          path: .dev/acceptance/run-*/sanitized/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
